{% extends "challan/base.html" %}
{% block title %}Log in — Challan System{% endblock %}
{% block content %}
<div style="max-width:380px;margin:60px auto;">
  <div class="card">
    <div class="card-header"><h3>Log in</h3></div>
    <div class="card-body">
      {% if form.errors %}
        <div class="notice error">Invalid username or password.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="form-group full" style="margin-bottom:14px;">
          <label>Username</label>
          {{ form.username }}
        </div>
        <div class="form-group full" style="margin-bottom:14px;">
          <label>Password</label>
          {{ form.password }}
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Log in</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
