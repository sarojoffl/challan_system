{% extends "challan/base.html" %}
{% block title %}Log in — Challan System{% endblock %}
{% block content %}
<div style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--color-bg); z-index:50;">
  <div class="card" style="width:100%; max-width:380px;">
    <div class="card-header"><h3>Log in</h3></div>
    <div class="card-body">
      {% if form.errors %}
        <div class="notice error">Invalid username or password.</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="form-group full" style="margin-bottom:14px;">
          <label for="{{ form.username.id_for_label }}">Username</label>
          {{ form.username }}
        </div>
        <div class="form-group full" style="margin-bottom:14px;">
          <label for="{{ form.password.id_for_label }}">Password</label>
          {{ form.password }}
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Log in</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
